name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # allows manual trigger from the GitHub UI

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true  # suppress Node20 deprecation warnings

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # 1. Check out source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Replace the committed gradlew (which has Windows CRLF endings) with
      #    the official clean copy straight from Gradle's GitHub — guaranteed LF.
      - name: Download official clean gradlew
        run: |
          curl -fsSL "https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradlew" -o gradlew
          chmod +x gradlew

      # 3. Set up JDK 17 (required by AGP 8.x)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 4. Set up Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. Accept all Android SDK licenses (prevents build failures)
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      # 6. Install required SDK components
      - name: Install SDK components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      # 7. Cache Gradle packages
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 8. Build the debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      # 9. Upload the APK as a downloadable artifact
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HabitTracker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
